name: Publicar documentos

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # comentário com o link de preview

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo: a data de "Atualizado em" vem do git log

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # master -> produção
      - name: Deploy (produção)
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # PR -> URL de preview para revisão do jurídico, sem afetar produção
      - name: Preview (PR)
        id: preview
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias pr-${{ github.event.number }}

      # Mantém um único comentário no PR com o link (atualizado a cada push).
      - name: Comentar link de preview no PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT: ${{ steps.preview.outputs.command-output }}
          PR: ${{ github.event.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          URL=$(echo "$OUTPUT" | grep -oP 'Preview Alias URL: \Khttps://\S+' | head -1)
          [ -n "$URL" ] || { echo "URL de preview não encontrada"; exit 1; }
          BODY="### 📄 Preview dos documentos

          **${URL}/legal/**

          É assim que o site ficará após o merge. Atualizado no commit \`${SHA::7}\`."
          echo "$BODY" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "$BODY"
